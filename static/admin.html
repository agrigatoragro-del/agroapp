<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель администратора - База пользователей</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-user-shield text-amber-400 text-2xl"></i>
                <h1 class="font-bold text-xl">Глобальная панель администратора</h1>
            </div>
            <a href="/" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl text-sm font-semibold transition flex items-center space-x-2 border border-slate-700">
                <i class="fa-solid fa-house"></i>
                <span>На главную</span>
            </a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 space-y-6">
        
        <!-- Секция: База всех пользователей -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h2 class="font-bold text-lg text-gray-900"><i class="fa-solid fa-users text-indigo-600 mr-2"></i>База клиентов и управление правами</h2>
                <button onclick="loadUsersList()" class="bg-green-600 hover:bg-green-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-1">
                    <i class="fa-solid fa-rotate mr-1"></i> <span>Обновить список</span>
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-100 text-gray-600 uppercase text-[11px] font-bold">
                        <tr>
                            <th class="p-4">ID</th>
                            <th class="p-4">Имя / Организация</th>
                            <th class="p-4">Телефон</th>
                            <th class="p-4">Тип</th>
                            <th class="p-4">БИН / ИИН</th>
                            <th class="p-4">Статус</th>
                            <th class="p-4 text-right">Действие</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body" class="divide-y divide-gray-100">
                        <tr><td colspan="7" class="p-6 text-center text-gray-400">Загрузка данных...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', loadUsersList);

        async function loadUsersList() {
            try {
                const res = await fetch('/api/users/admin/users-list');
                if (!res.ok) {
                    document.getElementById('users-table-body').innerHTML = `<tr><td colspan="7" class="p-6 text-center text-red-500">Ошибка загрузки пользователей</td></tr>`;
                    return;
                }
                const users = await res.json();
                const tbody = document.getElementById('users-table-body');
                
                if (users.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-gray-400">Пользователей пока нет</td></tr>`;
                    return;
                }

                tbody.innerHTML = users.map(u => `
                    <tr class="hover:bg-gray-50">
                        <td class="p-4 font-mono text-gray-400 text-xs">#${u.id}</td>
                        <td class="p-4 font-bold text-gray-900">${u.name || 'Без имени'}</td>
                        <td class="p-4 text-gray-700">${u.phone}</td>
                        <td class="p-4 text-xs text-gray-600">${u.user_type === 'company' ? 'Юр. лицо' : 'Физ. лицо'}</td>
                        <td class="p-4 font-mono text-xs text-gray-600">${u.bin_iin || '—'}</td>
                        <td class="p-4">
                            ${u.is_admin ? '<span class="px-2.5 py-1 bg-amber-100 text-amber-900 font-extrabold rounded-lg text-xs">Админ</span>' : '<span class="text-gray-400 text-xs font-semibold">Клиент</span>'}
                        </td>
                        <td class="p-4 text-right">
                            <button onclick="toggleAdmin(${u.id})" class="px-3 py-1.5 rounded-xl text-xs font-bold transition ${u.is_admin ? 'bg-red-50 text-red-600 hover:bg-red-100 border border-red-200' : 'bg-amber-500 text-white hover:bg-amber-600'}">
                                ${u.is_admin ? 'Снять админа' : 'Сделать админом'}
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        async function toggleAdmin(userId) {
            try {
                const res = await fetch(`/api/users/admin/toggle-admin/${userId}`, { method: 'POST' });
                if (res.ok) {
                    loadUsersList();
                } else {
                    alert('Не удалось изменить статус администратора');
                }
            } catch (e) {
                alert('Ошибка сети');
            }
        }
    </script>
</body>
</html>
