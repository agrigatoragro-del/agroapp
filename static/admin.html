<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление пользователями - AgroKZ Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-user-shield text-amber-400 text-2xl"></i>
                <h1 class="font-bold text-xl">Панель управления пользователями</h1>
            </div>
            <a href="/" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl text-sm font-semibold transition flex items-center space-x-2 border border-slate-700">
                <i class="fa-solid fa-house"></i>
                <span>На главную</span>
            </a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <div>
                    <h2 class="font-bold text-lg text-gray-900">База клиентов</h2>
                    <p class="text-xs text-gray-500 mt-0.5">Все зарегистрированные физические и юридические лица</p>
                </div>
                <button onclick="loadUsersList()" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1">
                    <i class="fa-solid fa-rotate"></i>
                    <span>Обновить</span>
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-gray-100 text-gray-600 uppercase text-[11px] font-bold tracking-wider">
                        <tr>
                            <th class="p-4">ID</th>
                            <th class="p-4">Имя / Организация</th>
                            <th class="p-4">Телефон</th>
                            <th class="p-4">Тип аккаунта</th>
                            <th class="p-4">БИН / ИИН</th>
                            <th class="p-4">Статус</th>
                            <th class="p-4 text-right">Действие</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body" class="divide-y divide-gray-100">
                        <tr>
                            <td colspan="7" class="p-8 text-center text-gray-400">Загрузка базы данных...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', loadUsersList);

        async function loadUsersList() {
            const tbody = document.getElementById('users-table-body');
            try {
                const res = await fetch('/api/users/admin/users-list');
                if (!res.ok) {
                    tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-red-500 font-semibold">Ошибка загрузки пользователей</td></tr>`;
                    return;
                }
                const users = await res.json();
                
                if (users.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-gray-400">База пользователей пуста</td></tr>`;
                    return;
                }

                tbody.innerHTML = users.map(u => {
                    const isCompany = u.user_type === 'company';
                    return `
                        <tr class="hover:bg-gray-50/80 transition">
                            <td class="p-4 font-mono text-gray-400 text-xs">#${u.id}</td>
                            <td class="p-4 font-bold text-gray-900">${u.name}</td>
                            <td class="p-4 text-gray-700">${u.phone}</td>
                            <td class="p-4">
                                <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${isCompany ? 'bg-blue-100 text-blue-800' : 'bg-green-100 text-green-800'}">
                                    ${isCompany ? 'Юр. лицо' : 'Физ. лицо / КХ'}
                                </span>
                            </td>
                            <td class="p-4 text-gray-500 font-mono text-xs">${u.bin_iin || '—'}</td>
                            <td class="p-4">
                                ${u.is_admin 
                                    ? '<span class="px-2.5 py-1 bg-amber-100 text-amber-900 font-bold rounded-full text-xs"><i class="fa-solid fa-crown mr-1"></i>Админ</span>' 
                                    : '<span class="text-gray-400 text-xs">Пользователь</span>'
                                }
                            </td>
                            <td class="p-4 text-right">
                                <button onclick="toggleAdmin(${u.id})" class="px-3 py-1.5 rounded-lg text-xs font-bold transition ${u.is_admin ? 'bg-red-50 text-red-600 hover:bg-red-100' : 'bg-amber-500 text-white hover:bg-amber-600'}">
                                    ${u.is_admin ? 'Снять админа' : 'Сделать админом'}
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');

            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-red-500">Ошибка соединения с сервером</td></tr>`;
            }
        }

        async function toggleAdmin(userId) {
            try {
                const res = await fetch(`/api/users/admin/toggle-admin/${userId}`, { method: 'POST' });
                if (res.ok) {
                    loadUsersList();
                } else {
                    alert('Не удалось изменить статус пользователя');
                }
            } catch (e) {
                alert('Ошибка сети');
            }
        }
    </script>
</body>
</html>
