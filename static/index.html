<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Агро-Маркетплейс Казахстана</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- ХЭДЕР -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-tractor text-green-600 text-2xl"></i>
                <span class="font-bold text-lg text-green-800">AgroKZ</span>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openAddAdModal()" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-lg text-sm font-semibold transition flex items-center space-x-1">
                    <i class="fa-solid fa-plus"></i>
                    <span>Подать объявление</span>
                </button>
                <div id="user-menu-container">
                    <button onclick="openAuthModal()" class="border border-green-600 text-green-700 hover:bg-green-50 px-3 py-1.5 rounded-lg text-sm font-semibold transition">
                        Войти / Регистрация
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-extrabold text-gray-900">Каталог агро-предложений</h1>
            <span id="guest-badge" class="text-xs bg-gray-200 text-gray-700 px-3 py-1 rounded-full font-medium">Режим гостя</span>
        </div>

        <!-- КАСКАДНАЯ ПАНЕЛЬ ФИЛЬТРОВ И ПОИСКА -->
        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm mb-6 space-y-3">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                
                <!-- 1. Тип сделки -->
                <div>
                    <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Тип сделки</label>
                    <select id="filter-deal-type" onchange="applyFilters()" class="w-full p-2.5 border rounded-xl text-sm outline-none bg-gray-50 focus:bg-white focus:border-green-600 transition">
                        <option value="all">Все предложения</option>
                        <option value="sell">🏷️ Продам</option>
                        <option value="buy">🛒 Куплю</option>
                    </select>
                </div>

                <!-- 2. Категория -->
                <div>
                    <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Категория</label>
                    <select id="filter-category" onchange="applyFilters()" class="w-full p-2.5 border rounded-xl text-sm outline-none bg-gray-50 focus:bg-white focus:border-green-600 transition">
                        <option value="all">Все категории</option>
                        <option value="Зерно">🌾 Зерно</option>
                        <option value="Техника">🚜 Техника</option>
                        <option value="Запчасти">⚙️ Запчасти</option>
                        <option value="Элеваторное оборудование">🏗️ Элеваторное оборудование</option>
                        <option value="Оборудование для МТФ">🐄 Оборудование для МТФ</option>
                        <option value="Скот">🐂 Скот</option>
                        <option value="Семена">🌱 Семена</option>
                        <option value="Ангары">🏢 Ангары</option>
                        <option value="Строительные услуги">🛠️ Строительные услуги</option>
                        <option value="Работа">👥 Работа</option>
                    </select>
                </div>

                <!-- 3. Выбор Области -->
                <div>
                    <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Область</label>
                    <select id="filter-region-oblast" onchange="onFilterOblastChange()" class="w-full p-2.5 border rounded-xl text-sm outline-none bg-gray-50 focus:bg-white focus:border-green-600 transition">
                        <option value="all">🇰🇿 Весь Казахстан</option>
                        <option value="Костанайская">Костанайская область</option>
                        <option value="Акмолинская">Акмолинская область</option>
                        <option value="СКО">Северо-Казахстанская область (СКО)</option>
                        <option value="Павлодарская">Павлодарская область</option>
                        <option value="Карагандинская">Карагандинская область</option>
                        <option value="Улытауская">Улытауская область</option>
                        <option value="ВКО">Восточно-Казахстанская область</option>
                        <option value="Абайская">Абайская область</option>
                        <option value="Актюбинская">Актюбинская область</option>
                        <option value="ЗКО">Западно-Казахстанская область</option>
                        <option value="Алматинская">Алматинская область</option>
                        <option value="Жетысуская">Жетысуская область</option>
                        <option value="Жамбылская">Жамбылская область</option>
                        <option value="Туркестанская">Туркестанская область</option>
                        <option value="Кызылординская">Кызылординская область</option>
                        <option value="Атырауская">Атырауская область</option>
                        <option value="Мангистауская">Мангистауская область</option>
                        <option value="г. Астана">г. Астана</option>
                        <option value="г. Алматы">г. Алматы</option>
                        <option value="г. Шымкент">г. Шымкент</option>
                    </select>
                </div>

                <!-- 4. Выбор Района / Города -->
                <div>
                    <label class="block text-[11px] font-bold text-gray-500 uppercase mb-1">Район / Райцентр</label>
                    <select id="filter-region-district" onchange="applyFilters()" disabled class="w-full p-2.5 border rounded-xl text-sm outline-none bg-gray-100 text-gray-400 focus:bg-white focus:border-green-600 transition">
                        <option value="all">Сначала выберите область</option>
                    </select>
                </div>

            </div>
        </div>

        <!-- СЕТКА ОБЪЯВЛЕНИЙ -->
        <div id="ads-container" class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <p class="text-gray-500 text-sm col-span-full text-center py-10">Загрузка объявлений...</p>
        </div>
    </main>

    <!-- МОДАЛЬНОЕ ОКНО АВТОРИЗАЦИИ / РЕГИСТРАЦИИ -->
    <div id="auth-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl relative">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h2 id="auth-modal-title" class="text-xl font-bold mb-4 text-gray-800">Личный кабинет</h2>

            <div class="flex mb-4 bg-gray-100 p-1 rounded-lg">
                <button id="tab-login-btn" onclick="switchAuthMode('login')" class="flex-1 py-1.5 text-xs font-semibold rounded-md bg-white shadow-sm text-green-700 transition">Вход</button>
                <button id="tab-register-btn" onclick="switchAuthMode('register')" class="flex-1 py-1.5 text-xs font-semibold text-gray-500 rounded-md transition">Регистрация</button>
            </div>

            <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-3">
                <div id="register-fields" class="hidden space-y-3">
                    <input type="text" id="reg-name" placeholder="Ваше имя / Наименование" class="w-full p-2.5 border rounded-xl text-sm outline-none focus:border-green-600">
                    
                    <!-- Разделение типов лиц -->
                    <select id="reg-type" onchange="onUserTypeChange()" class="w-full p-2.5 border rounded-xl text-sm outline-none focus:border-green-600 bg-white">
                        <option value="individual">Физическое лицо / КХ</option>
                        <option value="company">Юридическое лицо</option>
                    </select>

                    <!-- БИН для юр. лиц -->
                    <div id="bin-container" class="hidden">
                        <input type="text" id="reg-bin" placeholder="БИН организации (обязательно)" class="w-full p-2.5 border rounded-xl text-sm outline-none focus:border-green-600 bg-amber-50/50">
                    </div>
                </div>

                <input type="text" id="auth-phone" placeholder="Телефон (+7...)" required class="w-full p-2.5 border rounded-xl text-sm outline-none focus:border-green-600">
                <input type="password" id="auth-password" placeholder="Пароль" required class="w-full p-2.5 border rounded-xl text-sm outline-none focus:border-green-600">

                <button type="submit" id="auth-submit-btn" class="w-full bg-green-600 hover:bg-green-700 text-white py-2.5 rounded-xl font-bold text-sm transition">Войти</button>
            </form>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ПОДАЧИ ОБЪЯВЛЕНИЯ -->
    <div id="add-ad-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeAddAdModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h2 class="text-xl font-bold mb-4">Новое объявление</h2>
            <form id="ad-form" onsubmit="handleCreateAd(event)" class="space-y-3">
                
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Тип объявления:</label>
                    <select id="ad-deal-type" required class="w-full p-2.5 border rounded-xl text-sm outline-none bg-white">
                        <option value="sell" selected>🏷️ Продам (Продажа)</option>
                        <option value="buy">🛒 Куплю (Закуп / Покупка)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Категория:</label>
                    <select id="ad-category" required class="w-full p-2.5 border rounded-xl text-sm outline-none bg-white">
                        <option value="" disabled selected>Выберите категорию...</option>
                        <option value="Зерно">🌾 Зерно (Пшеница, Рапс, Ячмень и др.)</option>
                        <option value="Техника">🚜 Техника</option>
                        <option value="Запчасти">⚙️ Запчасти</option>
                        <option value="Элеваторное оборудование">🏗️ Элеваторное оборудование</option>
                        <option value="Оборудование для МТФ">🐄 Оборудование для МТФ</option>
                        <option value="Скот">🐂 Скот</option>
                        <option value="Семена">🌱 Семена</option>
                        <option value="Ангары">🏢 Ангары</option>
                        <option value="Строительные услуги">🛠️ Строительные услуги</option>
                        <option value="Работа">👥 Работа (Вакансии / Резюме)</option>
                    </select>
                </div>

                <!-- КАСКАДНЫЙ ВЫБОР ЛОКАЦИИ -->
                <div class="space-y-2 border p-3 rounded-xl bg-gray-50">
                    <label class="block text-xs font-bold text-gray-700">Местонахождение объекта:</label>
                    
                    <select id="ad-oblast" onchange="onAdOblastChange()" required class="w-full p-2 border rounded-lg text-sm bg-white">
                        <option value="" disabled selected>Выберите область...</option>
                        <option value="Костанайская">Костанайская область</option>
                        <option value="Акмолинская">Акмолинская область</option>
                        <option value="СКО">Северо-Казахстанская область (СКО)</option>
                        <option value="Павлодарская">Павлодарская область</option>
                        <option value="Карагандинская">Карагандинская область</option>
                        <option value="Улытауская">Улытауская область</option>
                        <option value="ВКО">Восточно-Казахстанская область</option>
                        <option value="Абайская">Абайская область</option>
                        <option value="Актюбинская">Актюбинская область</option>
                        <option value="ЗКО">Западно-Казахстанская область</option>
                        <option value="Алматинская">Алматинская область</option>
                        <option value="Жетысуская">Жетысуская область</option>
                        <option value="Жамбылская">Жамбылская область</option>
                        <option value="Туркестанская">Туркестанская область</option>
                        <option value="Кызылординская">Кызылординская область</option>
                        <option value="Атырауская">Атырауская область</option>
                        <option value="Мангистауская">Мангистауская область</option>
                        <option value="г. Астана">г. Астана</option>
                        <option value="г. Алматы">г. Алматы</option>
                        <option value="г. Шымкент">г. Шымкент</option>
                    </select>

                    <select id="ad-district" onchange="onAdDistrictChange()" disabled required class="w-full p-2 border rounded-lg text-sm bg-gray-100 text-gray-400">
                        <option value="" disabled selected>Сначала выберите область</option>
                    </select>

                    <div id="village-container">
                        <input type="text" id="ad-village" placeholder="Населенный пункт / село (необязательно, если выбран город)" class="w-full p-2 border rounded-lg text-sm bg-white">
                    </div>
                </div>

                <input type="text" id="ad-title" placeholder="Заголовок (напр.: Пшеница 3 класс / Трактор MТЗ)" required class="w-full p-2.5 border rounded-xl text-sm outline-none">
                <input type="number" id="ad-price" placeholder="Цена / Бюджет (тенге)" required class="w-full p-2.5 border rounded-xl text-sm outline-none">
                <textarea id="ad-desc" placeholder="Подробности (объем, состояние, качественные показатели...)" required class="w-full p-2.5 border rounded-xl text-sm outline-none h-20"></textarea>
                
                <!-- ФОТОГРАФИИ (ПРЕВЬЮ С ПЛЮСОМ) -->
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Фотографии (до 10 шт.):</label>
                    <div id="photo-preview-container" class="flex flex-wrap gap-2 items-center">
                        <label id="add-photo-btn-label" class="w-20 h-20 border-2 border-dashed border-gray-300 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:border-green-600 bg-white transition text-gray-400 hover:text-green-600">
                            <i class="fa-solid fa-plus text-xl mb-1"></i>
                            <span class="text-[10px] font-semibold">Добавить</span>
                            <input type="file" id="ad-images-input" accept="image/*" multiple class="hidden" onchange="handleImagesSelected(event)">
                        </label>
                    </div>
                </div>

                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-2.5 rounded-xl font-bold text-sm transition">
                    Опубликовать
                </button>
            </form>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
