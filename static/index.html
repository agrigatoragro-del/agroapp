<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Агро-Маркетплейс Казахстана</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen pb-20">

    <!-- Шапка приложения -->
    <header class="bg-green-700 text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-wheat-awn"></i> АгроМаркет KZ
            </h1>
            <span id="user-status-badge" class="text-xs bg-green-800 px-3 py-1 rounded-full border border-green-500">
                Гость
            </span>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="max-w-4xl mx-auto p-4">
        
        <!-- Панель поиска и фильтров -->
        <div class="bg-white rounded-xl shadow-sm p-4 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-2 mb-3">
                <input type="text" id="search-input" placeholder="Поиск: ангары, тракторы..." class="p-2 border rounded-lg focus:outline-none focus:border-green-600">
                
                <!-- Фильтр по всем регионам RК -->
                <select id="filter-region" class="p-2 border rounded-lg bg-white text-sm">
                    <option value="">Весь Казахстан</option>
                    <option value="Астана">г. Астана</option>
                    <option value="Алматы">г. Алматы</option>
                    <option value="Шымкент">г. Шымкент</option>
                    <option value="Костанайская область">Костанайская область</option>
                    <option value="Акмолинская область">Акмолинская область</option>
                    <option value="Северо-Казахстанская область">Северо-Казахстанская область</option>
                    <option value="Карагандинская область">Карагандинская область</option>
                    <option value="Павлодарская область">Павлодарская область</option>
                    <option value="Актюбинская область">Актюбинская область</option>
                    <option value="Западно-Казахстанская область">Западно-Казахстанская область</option>
                    <option value="Восточно-Казахстанская область">Восточно-Казахстанская область</option>
                    <option value="Абайская область">Абайская область</option>
                    <option value="Алматинская область">Алматинская область</option>
                    <option value="Жетысуская область">Жетысуская область</option>
                    <option value="Жамбылская область">Жамбылская область</option>
                    <option value="Туркестанская область">Туркестанская область</option>
                    <option value="Кызылординская область">Кызылординская область</option>
                    <option value="Атырауская область">Атырауская область</option>
                    <option value="Мангистауская область">Мангистауская область</option>
                    <option value="Улытауская область">Улытауская область</option>
                </select>

                <button onclick="loadAds()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">Найти</button>
            </div>
            
            <!-- Категории -->
            <div class="flex gap-2 overflow-x-auto pb-2 text-sm">
                <button onclick="filterCategory('')" class="cat-btn bg-gray-200 px-3 py-1 rounded-full whitespace-nowrap active">Все</button>
                <button onclick="filterCategory('Ангары')" class="cat-btn bg-gray-100 px-3 py-1 rounded-full whitespace-nowrap">Ангары</button>
                <button onclick="filterCategory('Зерновые комплексы')" class="cat-btn bg-gray-100 px-3 py-1 rounded-full whitespace-nowrap">Зернокомплексы</button>
                <button onclick="filterCategory('Сельхозтехника')" class="cat-btn bg-gray-100 px-3 py-1 rounded-full whitespace-nowrap">Сельхозтехника</button>
            </div>
        </div>

            <div class="text-center py-10 text-gray-500 col-span-full">Загрузка объявлений...</div>
        </div>

    <script>
        const API_BASE = '/api';
        let currentCategory = '';

        async function loadAds() {
            const container = document.getElementById('ads-list');
            const regionFilter = document.getElementById('filter-region').value;
            const searchQuery = document.getElementById('search-input').value.toLowerCase();

            try {
                const res = await fetch(`${API_BASE}/ads/`);
                let ads = await res.json();
                
                if (currentCategory) {
                    ads = ads.filter(ad => ad.category === currentCategory);
                }
                if (regionFilter) {
                    ads = ads.filter(ad => ad.location && ad.location.includes(regionFilter));
                }
                if (searchQuery) {
                    ads = ads.filter(ad => ad.title.toLowerCase().includes(searchQuery) || ad.description.toLowerCase().includes(searchQuery));
                }

                if (!ads || ads.length === 0) {
                    container.innerHTML = '<div class="text-center py-10 text-gray-500 col-span-full">Объявлений по вашему запросу не найдено.</div>';
                    return;
                }

                container.innerHTML = ads.map(ad => `
                    <div class="bg-white rounded-xl shadow-sm border p-4 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <span class="text-xs font-semibold bg-green-100 text-green-800 px-2 py-0.5 rounded">${ad.category}</span>
                                <span class="text-xs text-gray-500"><i class="fa-solid fa-location-dot text-green-600"></i> ${ad.location || 'Не указано'}</span>
                            </div>
                            <h3 class="font-bold text-lg text-gray-800 mb-1">${ad.title}</h3>
                            <p class="text-gray-600 text-sm mb-3 line-clamp-2">${ad.description}</p>
                        </div>
                        <div class="flex justify-between items-center border-t pt-3 mt-2">
                            <span class="text-xl font-extrabold text-green-700">${ad.price.toLocaleString()} ₸</span>
                            <button class="bg-gray-900 text-white text-xs px-3 py-2 rounded-lg hover:bg-gray-800">Контакты</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = '<div class="text-center py-10 text-red-500 col-span-full">Ошибка загрузки данных с сервера</div>';
            }
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-gray-200', 'active');
                btn.classList.add('bg-gray-100');
            });
            event.target.classList.remove('bg-gray-100');
            event.target.classList.add('bg-gray-200', 'active');
            loadAds();
        }

        function openAddModal() {
            document.getElementById('addModal').classList.remove('hidden');
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.add('hidden');
        }

        async function submitAd(event) {
            event.preventDefault();
            const data = {
                title: document.getElementById('ad-title').value,
                category: document.getElementById('ad-category').value,
                location: document.getElementById('ad-location').value,
                description: document.getElementById('ad-description').value,
                price: parseFloat(document.getElementById('ad-price').value),
                user_id: parseInt(document.getElementById('ad-user-id').value)
            };

            try {
                const res = await fetch(`${API_BASE}/ads/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    alert('Объявление успешно опубликовано!');
                    closeAddModal();
                    document.getElementById('ad-form').reset();
                    loadAds();
                } else {
                    const err = await res.json();
                    alert('Ошибка: ' + (err.detail || 'Не удалось создать объявление'));
                }
            } catch (e) {
                alert('Ошибка соединения с сервером');
            }
        }

        function showProfile() {
            alert('Раздел профиля и статус Verified Vendor в разработке.');
        }

        loadAds();
    </script>
