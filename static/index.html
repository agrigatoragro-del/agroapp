<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Агро-Маркетплейс Казахстана</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- ХЭДЕР -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-tractor text-green-600 text-2xl"></i>
                <span class="font-bold text-lg text-green-800">AgroKZ</span>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openAddAdModal()" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-lg text-sm font-semibold transition flex items-center space-x-1">
                    <i class="fa-solid fa-plus"></i>
                    <span>Подать объявление</span>
                </button>
                <div id="user-menu-container">
                    <button onclick="openAuthModal()" class="border border-green-600 text-green-700 hover:bg-green-50 px-3 py-1.5 rounded-lg text-sm font-semibold transition">
                        Войти / Регистрация
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-extrabold text-gray-900">Каталог агро-предложений</h1>
            <span id="guest-badge" class="text-xs bg-gray-200 text-gray-700 px-3 py-1 rounded-full font-medium">Режим гостя</span>
        </div>

        <!-- 1-Й УРОВЕНЬ ФИЛЬТРА: ПРОДАМ / КУПЛЮ -->
        <div class="flex space-x-2 mb-4 bg-gray-200 p-1 rounded-xl max-w-md">
            <button id="type-btn-all" onclick="filterDealType('all')" class="deal-type-btn flex-1 py-2 text-xs font-bold rounded-lg bg-white text-green-700 shadow-sm transition">Все предложения</button>
            <button id="type-btn-sell" onclick="filterDealType('sell')" class="deal-type-btn flex-1 py-2 text-xs font-bold rounded-lg text-gray-600 transition">🏷️ Продам</button>
            <button id="type-btn-buy" onclick="filterDealType('buy')" class="deal-type-btn flex-1 py-2 text-xs font-bold rounded-lg text-gray-600 transition">🛒 Куплю</button>
        </div>

        <!-- 2-Й УРОВЕНЬ ФИЛЬТРА: КАТЕГОРИИ -->
        <div class="mb-6">
            <div class="flex overflow-x-auto space-x-2 pb-2 scrollbar-none">
                <button onclick="filterCategory('all', event)" class="cat-btn active px-3.5 py-1.5 bg-green-600 text-white rounded-full text-xs font-semibold whitespace-nowrap shadow-sm transition">Все категории</button>
                <button onclick="filterCategory('Зерно', event)" class="cat-btn px-3.5 py-1.5 bg-white border border-gray-200 text-gray-700 hover:bg-green-50 rounded-full text-xs font-semibold whitespace-nowrap transition">🌾 Зерно</button>
                <button onclick="filterCategory('Техника', event)" class="cat-btn px-3.5 py-1.5 bg-white border border-gray-200 text-gray-700 hover:bg-green-50 rounded-full text-xs font-semibold whitespace-nowrap transition">🚜 Техника</button>
                <button onclick="filterCategory('Запчасти', event)" class="cat-btn px-3.5 py-1.5 bg-white border border-gray-200 text-gray-700 hover:bg-green-50 rounded-full text-xs font-semibold whitespace-nowrap transition">⚙️ Запчасти</button>
                <button onclick="filterCategory('Элеваторное оборудование', event)" class="cat-btn px-3.5 py-1.5 bg-white border border-gray-200 text-gray-700 hover:bg-green-50 rounded-full text-xs font-semibold whitespace-nowrap transition">🏗️ Элеваторное оборудование</button>
                <button onclick="filterCategory('Оборудование для МТФ', event)" class="cat-btn px-3.5 py-1.5 bg-white border border-gray-200 text-gray-700 hover:bg-green-50 rounded-full text-xs font-semibold whitespace-nowrap transition">🐄 Оборудование для МТФ</button>
                <button onclick="filterCategory('Скот', event)" class="cat-btn px-3.5 py-1.5 bg-white border border-gray-200 text-gray-700 hover:bg-green-50 rounded-full text-xs font-semibold whitespace-nowrap transition">🐂 Скот</button>
                <button onclick="filterCategory('Семена', event)" class="cat-btn px-3.5 py-1.5 bg-white border border-gray-200 text-gray-700 hover:bg-green-50 rounded-full text-xs font-semibold whitespace-nowrap transition">🌱 Семена</button>
                <button onclick="filterCategory('Ангары', event)" class="cat-btn px-3.5 py-1.5 bg-white border border-gray-200 text-gray-700 hover:bg-green-50 rounded-full text-xs font-semibold whitespace-nowrap transition">🏢 Ангары</button>
                <button onclick="filterCategory('Строительные услуги', event)" class="cat-btn px-3.5 py-1.5 bg-white border border-gray-200 text-gray-700 hover:bg-green-50 rounded-full text-xs font-semibold whitespace-nowrap transition">🛠️ Строительные услуги</button>
                <button onclick="filterCategory('Работа', event)" class="cat-btn px-3.5 py-1.5 bg-white border border-gray-200 text-gray-700 hover:bg-green-50 rounded-full text-xs font-semibold whitespace-nowrap transition">👥 Работа</button>
            </div>
        </div>

        <!-- СЕТКА ОБЪЯВЛЕНИЙ -->
        <div id="ads-container" class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <p class="text-gray-500 text-sm col-span-full text-center py-8">Загрузка объявлений...</p>
        </div>
    </main>

    <!-- МОДАЛЬНОЕ ОКНО АВТОРИЗАЦИИ / РЕГИСТРАЦИИ -->
    <div id="auth-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl relative">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h2 id="auth-modal-title" class="text-xl font-bold mb-4 text-gray-800">Личный кабинет</h2>

            <div class="flex mb-4 bg-gray-100 p-1 rounded-lg">
                <button id="tab-login-btn" onclick="switchAuthMode('login')" class="flex-1 py-1.5 text-xs font-semibold rounded-md bg-white shadow-sm text-green-700 transition">Вход</button>
                <button id="tab-register-btn" onclick="switchAuthMode('register')" class="flex-1 py-1.5 text-xs font-semibold text-gray-500 rounded-md transition">Регистрация</button>
            </div>

            <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-3">
                <div id="register-fields" class="hidden space-y-3">
                    <input type="text" id="reg-name" placeholder="Ваше имя / Наименование компании" class="w-full p-2.5 border rounded-xl text-sm outline-none focus:border-green-600">
                    <select id="reg-type" class="w-full p-2.5 border rounded-xl text-sm outline-none focus:border-green-600 bg-white">
                        <option value="individual">Физическое лицо</option>
                        <option value="company">Компания / КХ</option>
                    </select>
                </div>

                <input type="text" id="auth-phone" placeholder="Телефон (+7...)" required class="w-full p-2.5 border rounded-xl text-sm outline-none focus:border-green-600">
                <input type="password" id="auth-password" placeholder="Пароль" required class="w-full p-2.5 border rounded-xl text-sm outline-none focus:border-green-600">

                <button type="submit" id="auth-submit-btn" class="w-full bg-green-600 hover:bg-green-700 text-white py-2.5 rounded-xl font-bold text-sm transition">Войти</button>
            </form>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ПРОФИЛЯ И АДМИНКИ -->
    <div id="profile-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeProfileModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h2 class="text-xl font-bold mb-4 text-gray-800">Профиль пользователя</h2>
            
            <div id="profile-info" class="space-y-4"></div>

            <div id="admin-panel-section" class="bg-amber-50 rounded-xl p-4 border border-amber-300 hidden space-y-4 mt-4">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-md text-amber-900"><i class="fa-solid fa-shield-halved"></i> Панель модератора</h3>
                    <span class="text-[10px] bg-amber-200 text-amber-900 px-2 py-0.5 rounded-full font-semibold">Админ</span>
                </div>

                <div class="grid grid-cols-3 gap-2 text-center">
                    <div class="bg-white p-2 rounded-lg border border-amber-200 shadow-sm">
                        <p class="text-[10px] text-gray-500">Пользователи</p>
                        <p id="stat-users-count" class="font-extrabold text-amber-900 text-sm">0</p>
                    </div>
                    <div class="bg-white p-2 rounded-lg border border-amber-200 shadow-sm">
                        <p class="text-[10px] text-gray-500">Объявлений</p>
                        <p id="stat-ads-count" class="font-extrabold text-amber-900 text-sm">0</p>
                    </div>
                    <div class="bg-white p-2 rounded-lg border border-amber-200 shadow-sm">
                        <p class="text-[10px] text-gray-500">На модерации</p>
                        <p id="stat-pending-count" class="font-extrabold text-red-600 text-sm">0</p>
                    </div>
                </div>

                <div>
                    <p class="text-xs text-amber-800 font-semibold mb-2">Очередь объявлений:</p>
                    <div id="admin-moderation-list" class="space-y-2">
                        <p class="text-xs text-gray-500">Загрузка...</p>
                    </div>
                </div>
            </div>

            <button onclick="logout()" class="mt-6 w-full bg-red-50 hover:bg-red-100 text-red-600 py-2.5 rounded-xl font-bold text-sm transition">
                Выйти из аккаунта
            </button>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ПОДАЧИ ОБЪЯВЛЕНИЯ -->
    <div id="add-ad-modal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeAddAdModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <h2 class="text-xl font-bold mb-4">Новое объявление</h2>
            <form id="ad-form" onsubmit="handleCreateAd(event)" class="space-y-3">
                
                <!-- Тип предложения: Продам или Куплю -->
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Тип объявления:</label>
                    <select id="ad-deal-type" required class="w-full p-2.5 border rounded-xl text-sm outline-none bg-white">
                        <option value="sell" selected>🏷️ Продам (Продажа)</option>
                        <option value="buy">🛒 Куплю (Покупка / Закуп)</option>
                    </select>
                </div>

                <!-- Выбор категории -->
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Категория:</label>
                    <select id="ad-category" required class="w-full p-2.5 border rounded-xl text-sm outline-none bg-white">
                        <option value="" disabled selected>Выберите категорию...</option>
                        <option value="Зерно">🌾 Зерно (Пшеница, Рапс, Ячмень и др.)</option>
                        <option value="Техника">🚜 Техника</option>
                        <option value="Запчасти">⚙️ Запчасти</option>
                        <option value="Элеваторное оборудование">🏗️ Элеваторное оборудование</option>
                        <option value="Оборудование для МТФ">🐄 Оборудование для МТФ</option>
                        <option value="Скот">🐂 Скот</option>
                        <option value="Семена">🌱 Семена</option>
                        <option value="Ангары">🏢 Ангары</option>
                        <option value="Строительные услуги">🛠️ Строительные услуги</option>
                        <option value="Работа">👥 Работа (Вакансии / Резюме)</option>
                    </select>
                </div>

                <input type="text" id="ad-title" placeholder="Заголовок (напр.: Продам пшеницу 3 класс / Куплю трактор MTZ)" required class="w-full p-2.5 border rounded-xl text-sm outline-none">
                <input type="text" id="ad-location" placeholder="Регион / Город (напр.: Костанай)" required class="w-full p-2.5 border rounded-xl text-sm outline-none">
                <input type="number" id="ad-price" placeholder="Цена / Бюджет (тенге)" required class="w-full p-2.5 border rounded-xl text-sm outline-none">
                <textarea id="ad-desc" placeholder="Подробности (объем, состояние, контакты...)" required class="w-full p-2.5 border rounded-xl text-sm outline-none h-20"></textarea>
                <input type="file" id="ad-images" multiple accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100">

                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-2.5 rounded-xl font-bold text-sm transition">
                    Опубликовать
                </button>
            </form>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
