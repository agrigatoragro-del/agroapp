<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - Agro-Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- Хэдер -->
    <header class="bg-white shadow-sm sticky top-0 z-40 border-b border-gray-100">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/" class="flex items-center space-x-2 text-green-800 font-bold text-sm hover:text-green-700 transition">
                <i class="fa-solid fa-arrow-left"></i>
                <span>На главную</span>
            </a>
            <span class="font-extrabold text-gray-800 text-base">Личный кабинет</span>
        </div>
    </header>

    <!-- Основное содержимое -->
    <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full space-y-6">
        
        <!-- Информационная карточка пользователя -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-200 space-y-4">
            <div class="flex items-center justify-between">
                <div>
                    <h1 id="profile-name" class="text-xl font-extrabold text-gray-900">Загрузка...</h1>
                    <p id="profile-phone" class="text-gray-500 text-sm mt-1">Телефон...</p>
                </div>
                <div id="admin-badge" class="hidden">
                    <span class="bg-amber-100 text-amber-900 font-extrabold px-3 py-1 rounded-full text-xs flex items-center space-x-1 border border-amber-200">
                        <i class="fa-solid fa-crown text-amber-600"></i>
                        <span>Администратор</span>
                    </span>
                </div>
            </div>

            <div id="profile-details" class="text-xs text-gray-500 pt-3 border-t border-gray-100 space-y-1">
                <p>Тип аккаунта: <span id="profile-type" class="font-bold text-gray-700">—</span></p>
                <p id="profile-bin-container" class="hidden">БИН/ИИН: <span id="profile-bin" class="font-bold text-gray-700">—</span></p>
            </div>
        </div>

        <!-- Кнопка перехода к модерации объявлений (Видна только администратору) -->
        <div id="admin-btn-container" class="hidden">
            <a href="/static/moderation.html" class="w-full bg-amber-500 hover:bg-amber-600 text-white py-3.5 rounded-2xl font-bold text-sm transition flex items-center justify-center space-x-2 shadow-sm">
                <i class="fa-solid fa-clipboard-check text-lg"></i>
                <span>Перейти к модерации объявлений</span>
            </a>
        </div>

        <!-- Кнопка выхода -->
        <button onclick="logout()" class="w-full bg-red-50 hover:bg-red-100 text-red-600 py-3.5 rounded-2xl font-bold text-sm transition border border-red-100">
            Выйти из аккаунта
        </button>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', loadProfileData);

        function loadProfileData() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;

            if (!currentUser) {
                // Если не авторизован — отправляем на главную
                window.location.href = '/';
                return;
            }

            // Заполняем данные профиля
            document.getElementById('profile-name').textContent = currentUser.name || 'Без имени';
            document.getElementById('profile-phone').textContent = currentUser.phone;
            
            const typeText = currentUser.user_type === 'company' ? 'Юридическое лицо' : 'Физическое лицо / КХ';
            document.getElementById('profile-type').textContent = typeText;

            if (currentUser.bin_iin) {
                document.getElementById('profile-bin').textContent = currentUser.bin_iin;
                document.getElementById('profile-bin-container').classList.remove('hidden');
            }

            // Проверяем права администратора для отображения плашки и кнопки модерации
            if (currentUser.is_admin) {
                document.getElementById('admin-badge').classList.remove('hidden');
                document.getElementById('admin-btn-container').classList.remove('hidden');
            }
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = '/';
        }
    </script>
</body>
</html>
