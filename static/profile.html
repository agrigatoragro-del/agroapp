<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет - AgroKZ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- Хэдер -->
    <header class="bg-white shadow-sm sticky top-0 z-40 border-b border-gray-100">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/" class="flex items-center space-x-2 text-green-800 font-bold text-sm hover:text-green-700 transition">
                <i class="fa-solid fa-arrow-left"></i>
                <span>На главную</span>
            </a>
            <span class="font-extrabold text-gray-800 text-base">Личный кабинет</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full space-y-6">
        
        <!-- Аватарка и базовые данные -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-200 flex flex-col md:flex-row items-center space-y-4 md:space-y-0 md:space-x-6">
            <div class="relative">
                <div id="user-avatar-container" class="w-24 h-24 rounded-full bg-green-100 flex items-center justify-center text-green-700 text-3xl font-bold overflow-hidden border-2 border-green-600 shadow-inner">
                    <span id="avatar-initials">А</span>
                </div>
                <label class="absolute bottom-0 right-0 bg-green-600 hover:bg-green-700 text-white w-8 h-8 rounded-full flex items-center justify-center cursor-pointer shadow">
                    <i class="fa-solid fa-camera text-xs"></i>
                    <input type="file" accept="image/*" class="hidden" onchange="uploadAvatar(event)">
                </label>
            </div>

            <div class="flex-1 text-center md:text-left space-y-2">
                <div class="flex items-center justify-center md:justify-start space-x-3">
                    <h1 id="profile-name" class="text-xl font-extrabold text-gray-900">Загрузка...</h1>
                    <span id="admin-badge" class="hidden bg-amber-100 text-amber-900 font-extrabold px-3 py-1 rounded-full text-xs flex items-center space-x-1 border border-amber-200">
                        <i class="fa-solid fa-crown text-amber-600"></i>
                        <span>Администратор</span>
                    </span>
                </div>
                <p id="profile-phone" class="text-gray-500 text-sm">+7 (...)</p>
                <div class="flex flex-wrap justify-center md:justify-start gap-2">
                    <span id="profile-type-badge" class="px-3 py-1 bg-green-100 text-green-800 rounded-full text-xs font-semibold">Физическое лицо / КХ</span>
                </div>
            </div>
        </div>

        <!-- Кнопка перехода в Модерацию объявлений (для админов) -->
        <div id="admin-btn-container" class="hidden">
            <a href="/static/moderation.html" class="w-full bg-amber-500 hover:bg-amber-600 text-white py-3.5 rounded-2xl font-bold text-sm transition flex items-center justify-center space-x-2 shadow-sm">
                <i class="fa-solid fa-clipboard-check text-lg"></i>
                <span>Перейти к модерации объявлений</span>
            </a>
        </div>

        <!-- Кнопка перехода в Глобальную панель клиентов (для админов) -->
        <div id="global-admin-btn-container" class="hidden">
            <a href="/static/admin.html" class="w-full bg-slate-800 hover:bg-slate-900 text-white py-3.5 rounded-2xl font-bold text-sm transition flex items-center justify-center space-x-2 shadow-sm">
                <i class="fa-solid fa-users-gear text-lg"></i>
                <span>Управление базой клиентов</span>
            </a>
        </div>

        <!-- Форма редактирования -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-200 space-y-4">
            <h2 class="font-bold text-lg text-gray-800 border-b pb-3">Редактирование данных профиля</h2>
            
            <form id="edit-profile-form" onsubmit="saveProfileChanges(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Имя / Наименование организации:</label>
                    <input type="text" id="edit-name" class="w-full p-2.5 border rounded-xl text-sm outline-none focus:border-green-600">
                </div>

                <div id="edit-bin-wrapper" class="hidden">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">БИН компании:</label>
                    <input type="text" id="edit-bin" class="w-full p-2.5 border rounded-xl text-sm outline-none focus:border-green-600 bg-gray-50">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Номер телефона (логин):</label>
                    <input type="text" id="edit-phone" disabled class="w-full p-2.5 border rounded-xl text-sm bg-gray-100 text-gray-500 cursor-not-allowed">
                </div>

                <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold transition">
                    Сохранить изменения
                </button>
            </form>
        </div>

        <!-- Форма смены пароля -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-200 space-y-4">
            <h2 class="font-bold text-lg text-gray-800 border-b pb-3">Смена пароля</h2>
            <form onsubmit="changePassword(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Новый пароль:</label>
                    <input type="password" id="new-password" required placeholder="Введите новый пароль" class="w-full p-2.5 border rounded-xl text-sm outline-none focus:border-green-600">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Подтвердите новый пароль:</label>
                    <input type="password" id="confirm-password" required placeholder="Повторите пароль" class="w-full p-2.5 border rounded-xl text-sm outline-none focus:border-green-600">
                </div>
                <button type="submit" class="bg-gray-800 hover:bg-gray-900 text-white px-5 py-2.5 rounded-xl text-sm font-bold transition">
                    Обновить пароль
                </button>
            </form>
        </div>

        <button onclick="logout()" class="w-full bg-red-50 hover:bg-red-100 text-red-600 py-3 rounded-2xl font-bold text-sm transition border border-red-100">
            Выйти из аккаунта
        </button>
    </main>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;

        document.addEventListener('DOMContentLoaded', () => {
            if (!currentUser) {
                window.location.href = '/';
                return;
            }
            loadProfileData();
        });

        function loadProfileData() {
            document.getElementById('profile-name').textContent = currentUser.name || 'Без имени';
            document.getElementById('profile-phone').textContent = currentUser.phone;
            document.getElementById('edit-name').value = currentUser.name || '';
            document.getElementById('edit-phone').value = currentUser.phone;
            
            const typeBadge = document.getElementById('profile-type-badge');
            if (currentUser.user_type === 'company') {
                typeBadge.textContent = 'Юридическое лицо';
                document.getElementById('edit-bin-wrapper').classList.remove('hidden');
                document.getElementById('edit-bin').value = currentUser.bin_iin || '';
            } else {
                typeBadge.textContent = 'Физическое лицо / КХ';
            }

            if (currentUser.is_admin) {
                document.getElementById('admin-badge').classList.remove('hidden');
                document.getElementById('admin-btn-container').classList.remove('hidden');
                document.getElementById('global-admin-btn-container').classList.remove('hidden');
            }

            const initial = (currentUser.name || currentUser.phone || 'А').charAt(0).toUpperCase();
            document.getElementById('avatar-initials').textContent = initial;

            const savedAvatar = localStorage.getItem(`avatar_${currentUser.phone}`);
            if (savedAvatar) {
                document.getElementById('user-avatar-container').innerHTML = `<img src="${savedAvatar}" class="w-full h-full object-cover">`;
            }
        }

        function saveProfileChanges(e) {
            e.preventDefault();
            currentUser.name = document.getElementById('edit-name').value;
            if (currentUser.user_type === 'company') {
                currentUser.bin_iin = document.getElementById('edit-bin').value;
            }
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            alert('Данные профиля успешно сохранены!');
            loadProfileData();
        }

        function changePassword(e) {
            e.preventDefault();
            const p1 = document.getElementById('new-password').value;
            const p2 = document.getElementById('confirm-password').value;
            if (p1 !== p2) {
                alert('Пароли не совпадают!');
                return;
            }
            alert('Пароль успешно обновлен');
            document.getElementById('new-password').value = '';
            document.getElementById('confirm-password').value = '';
        }

        function uploadAvatar(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const imgData = event.target.result;
                document.getElementById('user-avatar-container').innerHTML = `<img src="${imgData}" class="w-full h-full object-cover">`;
                localStorage.setItem(`avatar_${currentUser.phone}`, imgData);
            };
            reader.readAsDataURL(file);
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = '/';
        }
    </script>
</body>
</html>
